server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker can assign a new IP when the API container is recreated.
        # Resolve the service name for every request window instead of pinning
        # the address that existed when nginx first started.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 哈希资源（Vite 构建产物，文件名含 content hash）：长期不可变缓存，
    # 发版后文件名变化即天然失效，无需协商。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 入口与未哈希资源：禁用缓存，保证发版后立即生效。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
}
